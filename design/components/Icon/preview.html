<!doctype html>
<html>
<head><meta charset="utf-8"><title>preview</title></head>
<body style="margin:0">
<div id="root" class="fv-surface"></div>
<script>
var F = window.FamilyVault, h = React.createElement;
var names = ['home','home-fill','users','plus','upload','user','search','more','back','camera','image','play','check','cloud-check','wifi-off','alert','clock','mail','folder','lock','retry','chevron','x'];
ReactDOM.createRoot(document.getElementById('root')).render(h('div', {className:'fv-row', style:{gap:'16px'}}, names.map(function(n){
  return h('div', {key:n, style:{display:'flex', flexDirection:'column', alignItems:'center', gap:'6px', width:'72px'}},
    h(F.Icon, {name:n, size:26}),
    h('span', {style:{fontSize:'12px', lineHeight:'16px', color:'var(--ink-muted)'}}, n));
})));
</script>
</body>
</html>
